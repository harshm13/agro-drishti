<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroDrishti - AI Crop Disease Detection | एग्रोदृष्टि</title>
    <meta name="description" content="AgroDrishti: AI-Powered Crop Disease Detection with 100% Biological Organic Solutions." />

    <!-- Google Fonts: Poppins (English) & Noto Sans Devanagari (Hindi) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Prevent theme flickering on reload -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAFAFA] dark:bg-[#121212] text-[#212121] dark:text-[#E0E0E0] min-h-screen antialiased selection:bg-[#A5D6A7] selection:text-[#1B5E20] transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
